{% extends "base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}

<h1>My Projects</h1>

<div class="projects">

    {% for project in projects %}

    <div class="card">

        <img src="{{ url_for('static', filename='images/' + project.image) }}"
             alt="{{ project.title }}">

        <h3>{{ project.title }}</h3>

        <p>{{ project.description }}</p>

        <a href="{{ project.link }}" target="_blank" class="btn">
            View Project
        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
